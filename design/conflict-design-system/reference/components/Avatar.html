<!doctype html>
<html><head><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/conflict.css"><script defer src="../../js/conflict.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<style>
  body { padding: 28px 28px 36px; }
  .ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }

  .ds-note { font: 500 12px/1.5 var(--font-mono); color: var(--ink-muted); margin: 0; }
  .ds-note b { color: var(--ink); font-weight: 600; }
</style>
</head><body>
<div class="ds-row" style="align-items:flex-end;gap:48px">
  <div><span class="ds-cap">Panel · 220px</span><div class="avatar" style="width:220px"><img src="../../img/avatar.jpg" alt="conflict's avatar" width="640" height="640"></div></div>
  <div><span class="ds-cap">Small · 72px</span><div class="avatar avatar--sm"><img src="../../img/avatar.jpg" alt="" width="640" height="640"></div></div>
  <div><span class="ds-cap">The cut (hero)</span><div class="hero__art" style="width:250px"><div class="cut"><div class="avatar"><img src="../../img/avatar.jpg" alt="" width="640" height="640"></div></div></div></div>
</div>
<p class="ds-note" style="margin-top:22px">hover · dot layer <b>transform</b> 2.5px + <b>opacity</b>, image <b>filter</b> contrast · <b>dur-base</b> <b>ease-ink</b></p>
</body></html>

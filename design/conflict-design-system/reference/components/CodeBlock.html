  <div class="highlight"><pre><span></span><span class="cp">&lt;?php</span>
<span class="c1">// render the current user's notes</span>
<span class="k">final</span> <span class="k">class</span> <span class="nc">NoteRepository</span>
<span class="p">{</span>
    <span class="k">public</span> <span class="k">function</span> <span class="fm">__construct</span><span class="p">(</span><span class="k">private</span> <span class="nx">PDO</span> <span class="nv">$db</span><span class="p">)</span> <span class="p">{}</span>

    <span class="k">public</span> <span class="k">function</span> <span class="nf">forUser</span><span class="p">(</span><span class="kt">int</span> <span class="nv">$id</span><span class="p">):</span> <span class="kt">array</span>
    <span class="p">{</span>
<span class="hll">        <span class="nv">$q</span> <span class="o">=</span> <span class="nv">$this</span><span class="o">-&gt;</span><span class="na">db</span><span class="o">-&gt;</span><span class="na">prepare</span><span class="p">(</span><span class="s1">'SELECT title, body FROM notes WHERE owner = ?'</span><span class="p">);</span>
</span>        <span class="nv">$q</span><span class="o">-&gt;</span><span class="na">execute</span><span class="p">([</span><span class="nv">$id</span><span class="p">]);</span>
        <span class="k">return</span> <span class="nv">$q</span><span class="o">-&gt;</span><span class="na">fetchAll</span><span class="p">(</span><span class="nx">PDO</span><span class="o">::</span><span class="na">FETCH_ASSOC</span><span class="p">);</span>
    <span class="p">}</span>
<span class="p">}</span>

<span class="k">echo</span> <span class="nb">htmlspecialchars</span><span class="p">(</span><span class="nv">$note</span><span class="p">[</span><span class="s1">'title'</span><span class="p">],</span> <span class="no">ENT_QUOTES</span><span class="p">,</span> <span class="s2">"UTF-8"</span><span class="p">)</span> <span class="o">.</span> <span class="s2">"</span><span class="se">\n</span><span class="s2">"</span><span class="p">;</span>
<span class="nv">$limit</span> <span class="o">=</span> <span class="nv">$cfg</span><span class="p">[</span><span class="s1">'limit'</span><span class="p">]</span> <span class="o">??</span> <span class="mi">20</span><span class="p">;</span> <span class="nv">$strict</span> <span class="o">=</span> <span class="kc">true</span><span class="p">;</span>

<span class="p">};</span>
<span class="c1">// mood is stored client-side, keyed by note id</span>
<span class="nb">document</span><span class="p">.</span><span class="nx">querySelector</span><span class="p">(</span><span class="s1">'#mood'</span><span class="p">).</span><span class="nx">addEventListener</span><span class="p">(</span><span class="s1">'input'</span><span class="p">,</span> <span class="nx">debounce</span><span class="p">((</span><span class="nx">e</span><span class="p">)</span> <span class="p">=&gt;</span> <span class="p">{</span>
  <span class="nx">localStorage</span><span class="p">.</span><span class="nx">setItem</span><span class="p">(</span><span class="sb">`mood:</span><span class="si">${</span><span class="nx">e</span><span class="p">.</span><span class="nx">target</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">id</span><span class="si">}</span><span class="sb">`</span><span class="p">,</span> <span class="nx">e</span><span class="p">.</span><span class="nx">target</span><span class="p">.</span><span class="nx">value</span><span class="p">);</span>
<span class="p">}));</span>

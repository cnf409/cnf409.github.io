<!doctype html>
<html><head><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/conflict.css"><script defer src="../../js/conflict.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<style>
  body { padding: 28px 28px 36px; }
  .ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
  .ds-stack { display: grid; gap: 22px; }
  .ds-cap { display: block; margin: 0 0 10px; font: 600 10.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .ds-note { font: 500 12px/1.5 var(--font-mono); color: var(--ink-muted); margin: 0; }
  .ds-note b { color: var(--ink); font-weight: 600; }
</style>
<style>.pw{display:grid;grid-template-columns:repeat(5,1fr);gap:28px;align-items:end}.box{height:90px;background:var(--paper)}</style></head><body>
<div class="ds-stack">
  <div class="pw">
    <div><div class="box" style="border:var(--stroke-hair) solid var(--ink)"></div><p class="ds-note"><b>stroke-hair</b> 1px · rows, easy</p></div>
    <div><div class="box" style="border:var(--stroke-thin) solid var(--ink)"></div><p class="ds-note"><b>stroke-thin</b> 2px · cards, code</p></div>
    <div><div class="box" style="border:var(--stroke-panel) solid var(--ink)"></div><p class="ds-note"><b>stroke-panel</b> 3px · info, search</p></div>
    <div><div class="box" style="border:var(--stroke-heavy) solid var(--ink)"></div><p class="ds-note"><b>stroke-heavy</b> 6px · flag, 404</p></div>
    <div><div class="panel box tone-drop" style="margin-right:8px"><span class="panel__tab">Tab</span></div><p class="ds-note" style="margin-top:14px"><b>panel</b> + tab + tone drop</p></div>
  </div>
  <div class="ds-row" style="gap:48px;align-items:flex-end">
    <div style="width:240px"><div class="cut"><div class="box tone tone--light" style="height:110px"></div></div><p class="ds-note" style="margin-top:8px"><b>.cut</b> · the diagonal panel edge, once per page</p></div>
    <div><span class="balloon" style="font:600 15px/1.3 var(--font-sans)">This page doesn't exist.</span><p class="ds-note" style="margin-top:28px"><b>.balloon</b> · speech edge, 404 only</p></div>
  </div>
</div></body></html>

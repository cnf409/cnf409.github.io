<!doctype html>
<html><head><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/conflict.css"><script defer src="../../js/conflict.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<style>
  body { padding: 28px 28px 36px; }
  .ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
  .ds-stack { display: grid; gap: 22px; }
  .ds-cap { display: block; margin: 0 0 10px; font: 600 10.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .ds-note { font: 500 12px/1.5 var(--font-mono); color: var(--ink-muted); margin: 0; }
  .ds-note b { color: var(--ink); font-weight: 600; }
</style>
</head><body>
<div class="ds-row" style="gap:36px">
  <div><span class="ds-cap">1 / 3</span><span class="stars" role="img" aria-label="1 of 3 stars"><i></i><i class="off"></i><i class="off"></i></span></div>
  <div><span class="ds-cap">2 / 3</span><span class="stars" role="img" aria-label="2 of 3 stars"><i></i><i></i><i class="off"></i></span></div>
  <div><span class="ds-cap">3 / 3 · large</span><span class="stars stars--lg" role="img" aria-label="3 of 3 stars"><i></i><i></i><i></i></span></div>
  <div><span class="ds-cap">My rating</span><span class="score"><b>9.5</b><span>/ 10</span></span></div>
</div></body></html>
